<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  text { font-size: 14px; fill: #1d2330; }
  .title { font-size: 20px; font-weight: 700; }
  .h { font-size: 15px; font-weight: 700; }
  .s { font-size: 12.5px; fill: #5d6677; }
  .lane { font-size: 12px; font-weight: 700; fill: #8a93a5; letter-spacing: 1px; }
  .impl { fill: #eef3ff; stroke: #2f5bd3; stroke-width: 2; }
  .sim { fill: #fff8ea; stroke: #d99a1e; stroke-width: 2; stroke-dasharray: 7 4; }
  .plan { fill: #f4f5f7; stroke: #9aa3b2; stroke-width: 2; stroke-dasharray: 3 4; }
  .person { fill: #e9f6ef; stroke: #2e8b57; stroke-width: 2; }
  .arrow { stroke: #1d2330; stroke-width: 1.8; fill: none; marker-end: url(#a); }
  .arrowp { stroke: #9aa3b2; stroke-width: 1.8; fill: none; stroke-dasharray: 3 4; marker-end: url(#ap); }
  .lbl { font-size: 12px; fill: #1d2330; }
  .lblbg { fill: #fff; }
</style></head>
<body>
<svg width="1400" height="860" viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker>
  </defs>

  <text x="30" y="40" class="title">CheckPoint: system architecture</text>

  <!-- legend -->
  <rect x="760" y="20" width="26" height="18" class="impl" rx="4"/><text x="794" y="34" class="s">Implemented</text>
  <rect x="890" y="20" width="26" height="18" class="sim" rx="4"/><text x="924" y="34" class="s">Simulated</text>
  <rect x="1010" y="20" width="26" height="18" class="plan" rx="4"/><text x="1044" y="34" class="s">Planned</text>
  <rect x="1120" y="20" width="26" height="18" class="person" rx="4"/><text x="1154" y="34" class="s">Person</text>

  <!-- lane labels -->
  <text x="30" y="90" class="lane">PERSON</text>
  <text x="30" y="250" class="lane">INTERFACE (browser)</text>
  <text x="30" y="500" class="lane">LOGIC</text>
  <text x="30" y="700" class="lane">AI / DATA</text>

  <!-- person -->
  <rect x="470" y="70" width="440" height="80" class="person" rx="10"/>
  <text x="690" y="102" text-anchor="middle" class="h">Student / early-career developer</text>
  <text x="690" y="126" text-anchor="middle" class="s">reads flags · marks lines · rates confidence · accepts / rejects / undoes</text>

  <!-- interface -->
  <rect x="30" y="265" width="250" height="110" class="impl" rx="10"/>
  <text x="155" y="295" text-anchor="middle" class="h">Suggestion view</text>
  <text x="155" y="318" text-anchor="middle" class="s">"writing…" status</text>
  <text x="155" y="338" text-anchor="middle" class="s">code + line numbers</text>
  <text x="155" y="358" text-anchor="middle" class="s">click line = mark as wrong</text>

  <rect x="300" y="265" width="250" height="110" class="impl" rx="10"/>
  <text x="425" y="295" text-anchor="middle" class="h">Risk highlights</text>
  <text x="425" y="318" text-anchor="middle" class="s">red = high, amber = check</text>
  <text x="425" y="338" text-anchor="middle" class="s">⚑ why? → reason + 1 check</text>
  <text x="425" y="358" text-anchor="middle" class="s">"unflagged ≠ correct" note</text>

  <rect x="570" y="265" width="250" height="110" class="impl" rx="10"/>
  <text x="695" y="295" text-anchor="middle" class="h">Confidence + decision</text>
  <text x="695" y="318" text-anchor="middle" class="s">0–100% slider</text>
  <text x="695" y="338" text-anchor="middle" class="s">Accept (locked until rated)</text>
  <text x="695" y="358" text-anchor="middle" class="s">Reject</text>

  <rect x="840" y="265" width="250" height="110" class="impl" rx="10"/>
  <text x="965" y="295" text-anchor="middle" class="h">Accepted, not yet checked</text>
  <text x="965" y="318" text-anchor="middle" class="s">flags persist after Accept</text>
  <text x="965" y="338" text-anchor="middle" class="s">"I checked it"</text>
  <text x="965" y="358" text-anchor="middle" class="s">"Undo acceptance"</text>

  <rect x="1110" y="265" width="260" height="110" class="impl" rx="10"/>
  <text x="1240" y="295" text-anchor="middle" class="h">Results screen</text>
  <text x="1240" y="318" text-anchor="middle" class="s">bugs caught / missed</text>
  <text x="1240" y="338" text-anchor="middle" class="s">confidence: correct vs buggy</text>
  <text x="1240" y="358" text-anchor="middle" class="s">accepted with unchecked flags</text>

  <!-- logic -->
  <rect x="300" y="470" width="520" height="100" class="impl" rx="10"/>
  <text x="560" y="500" text-anchor="middle" class="h">Interaction controller (app.js)</text>
  <text x="560" y="524" text-anchor="middle" class="s">states: generating → reviewing → accepted / rejected → checked / undone</text>
  <text x="560" y="546" text-anchor="middle" class="s">judges outcome against known bug lines</text>

  <rect x="860" y="470" width="250" height="100" class="impl" rx="10"/>
  <text x="985" y="500" text-anchor="middle" class="h">Event log</text>
  <text x="985" y="524" text-anchor="middle" class="s">timestamped actions</text>
  <text x="985" y="546" text-anchor="middle" class="s">JSON export</text>

  <rect x="30" y="470" width="250" height="100" class="impl" rx="10"/>
  <text x="155" y="500" text-anchor="middle" class="h">Risk detector</text>
  <text x="155" y="524" text-anchor="middle" class="s">pattern rules (detectors.js)</text>
  <text x="155" y="546" text-anchor="middle" class="s">criterion = sensitivity setting</text>

  <!-- AI / data -->
  <rect x="300" y="680" width="300" height="100" class="sim" rx="10"/>
  <text x="450" y="710" text-anchor="middle" class="h">Task bank + AI suggestions</text>
  <text x="450" y="734" text-anchor="middle" class="s">5 pre-scripted suggestions (cases.js)</text>
  <text x="450" y="756" text-anchor="middle" class="s">4 with planted bugs, 1 correct</text>

  <rect x="640" y="680" width="260" height="100" class="plan" rx="10"/>
  <text x="770" y="710" text-anchor="middle" class="h">Live code model</text>
  <text x="770" y="734" text-anchor="middle" class="s">would replace pre-scripted</text>
  <text x="770" y="756" text-anchor="middle" class="s">suggestions</text>

  <rect x="30" y="680" width="250" height="100" class="plan" rx="10"/>
  <text x="155" y="710" text-anchor="middle" class="h">Edit-likelihood model</text>
  <text x="155" y="734" text-anchor="middle" class="s">same {line, level, reason,</text>
  <text x="155" y="756" text-anchor="middle" class="s">check} output as rules</text>

  <rect x="940" y="680" width="250" height="100" class="plan" rx="10"/>
  <text x="1065" y="710" text-anchor="middle" class="h">Editor integration</text>
  <text x="1065" y="734" text-anchor="middle" class="s">e.g. VS Code extension</text>
  <text x="1065" y="756" text-anchor="middle" class="s">+ participant study</text>

  <!-- arrows: person <-> interface -->
  <path class="arrow" d="M560,150 L560,262"/>
  <rect x="452" y="192" width="104" height="18" class="lblbg"/><text x="504" y="205" text-anchor="middle" class="lbl">actions</text>
  <path class="arrow" d="M820,262 L820,153"/>
  <rect x="826" y="192" width="110" height="18" class="lblbg"/><text x="880" y="205" text-anchor="middle" class="lbl">flags, feedback</text>

  <!-- interface <-> controller -->
  <path class="arrow" d="M695,375 L695,467"/>
  <rect x="701" y="410" width="128" height="18" class="lblbg"/><text x="765" y="423" text-anchor="middle" class="lbl">confidence, decision</text>
  <path class="arrow" d="M425,467 L425,378"/>
  <rect x="420" y="410" width="0" height="0" class="lblbg"/><text x="508" y="423" text-anchor="middle" class="lbl">render state + flags</text>
  <path class="arrow" d="M965,375 L965,448 L790,448 L790,467"/>
  <text x="880" y="441" text-anchor="middle" class="lbl">check / undo</text>
  <path class="arrow" d="M820,520 L857,520"/>
  <path class="arrow" d="M1110,520 L1240,520 L1240,378"/>
  <rect x="1128" y="440" width="128" height="18" class="lblbg"/><text x="1192" y="453" text-anchor="middle" class="lbl">recorded decisions</text>

  <!-- controller <-> detector -->
  <path class="arrow" d="M300,505 L283,505"/>
  <path class="arrow" d="M283,535 L297,535"/>
  <text x="125" y="458" text-anchor="middle" class="lbl">code + sensitivity ⇄ flags</text>
  <path class="arrow" d="M330,467 L330,445 L250,445 L250,378"/>

  <!-- data -> controller -->
  <path class="arrow" d="M450,677 L450,573"/>
  <rect x="456" y="615" width="140" height="18" class="lblbg"/><text x="526" y="628" text-anchor="middle" class="lbl">suggestion + bug lines</text>

  <!-- planned -->
  <path class="arrowp" d="M640,730 L603,730"/>
  <path class="arrowp" d="M155,677 L155,573"/>
  <text x="200" y="628" class="lbl" fill="#5d6677">replaces rules</text>
</svg>
</body></html>
